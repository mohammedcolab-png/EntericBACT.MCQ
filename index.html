const sectionNames = [...new Set(BANK.map(q=>q.section))];
let currentSection = sectionNames[0];
const answers = {};
const letters = ['A','B','C','D'];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderNav(){
 const box=document.getElementById('sectionList'); box.innerHTML='';
 sectionNames.forEach((name,i)=>{const b=document.createElement('button');b.className='section-btn'+(name===currentSection?' active':'');b.textContent=`${i+1}. ${name} (${BANK.filter(q=>q.section===name).length})`;b.onclick=()=>{currentSection=name;render();};box.appendChild(b);});
}
function render(){
 renderNav();
 const qs=BANK.map((q,i)=>({...q,index:i})).filter(q=>q.section===currentSection);
 document.getElementById('sectionTitle').innerHTML='<h2>'+esc(currentSection)+'</h2>';
 document.getElementById('sectionMeta').textContent=`${qs.length} questions · Choose an option to see the correct answer immediately.`;
 const holder=document.getElementById('questions');holder.innerHTML='';
 qs.forEach(q=>{
  const selected=answers[q.index];
  const card=document.createElement('article');card.className='question';
  let opts=q.options.map((o,j)=>{
   let cls='option';if(selected!==undefined&&j===q.answer)cls+=' correct';if(selected===j&&j!==q.answer)cls+=' wrong';
   return `<button class="${cls}" ${selected!==undefined?'disabled':''} onclick="choose(${q.index},${j})"><span class="letter">${letters[j]}.</span><span>${esc(o)}</span></button>`;
  }).join('');
  let fb='';
  if(selected!==undefined){const correct=selected===q.answer;fb=`<div class="feedback show ${correct?'':'wrongfb'}"><b>${correct?'Correct!':'Not quite.'}</b> Correct answer: ${letters[q.answer]}. ${esc(q.options[q.answer])}<br><span>${esc(q.explanation)}</span></div>`;}
  card.innerHTML=`<div class="qnum">Question ${q.index+1} of ${BANK.length}</div><div class="stem">${esc(q.question)}</div>${opts}${fb}`;
  holder.appendChild(card);
 });
 document.getElementById('prevBtn').disabled=sectionNames.indexOf(currentSection)===0;
 document.getElementById('nextBtn').disabled=sectionNames.indexOf(currentSection)===sectionNames.length-1;
 const total=Object.keys(answers).length,correct=Object.entries(answers).filter(([i,a])=>BANK[+i].answer===a).length;
 document.getElementById('score').textContent=`Score: ${correct} / ${total}`;
 document.getElementById('attempted').textContent=`Answered: ${total} / ${BANK.length}`;
 document.getElementById('progressBar').style.width=(total/BANK.length*100)+'%';
}
function choose(i,j){if(answers[i]!==undefined)return;answers[i]=j;render();}
function moveSection(delta){const i=sectionNames.indexOf(currentSection)+delta;if(i>=0&&i<sectionNames.length){currentSection=sectionNames[i];render();window.scrollTo({top:0,behavior:'smooth'});}}
function resetAll(){if(confirm('Reset all answers and scores?')){Object.keys(answers).forEach(k=>delete answers[k]);currentSection=sectionNames[0];render();}}
render();
</script></body></html>
